<!-- Knee Joint Anatomy and Arthroscopy Vector -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kneeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091426"/>
      <stop offset="100%" stop-color="#0f2942"/>
    </linearGradient>
    <linearGradient id="cartilageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ligamentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="16" fill="url(#kneeBg)"/>

  <!-- Radial grid circles -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.3" fill="none">
    <circle cx="250" cy="250" r="120"/>
    <circle cx="250" cy="250" r="180"/>
    <line x1="100" y1="250" x2="400" y2="250" stroke-dasharray="4 4"/>
    <line x1="250" y1="80" x2="250" y2="420" stroke-dasharray="4 4"/>
  </g>

  <!-- Femur (Thigh bone) -->
  <path d="M 210 50 L 210 160 C 210 190 170 210 170 240 C 170 260 200 270 230 260 C 245 255 255 255 270 260 C 300 270 330 260 330 240 C 330 210 290 190 290 160 L 290 50 Z" 
        fill="#e2e8f0" stroke="#0284c7" stroke-width="3"/>

  <!-- Femoral Articular Cartilage Condyles (highlighted) -->
  <path d="M 172 235 C 170 258 198 268 228 258 C 210 250 185 245 172 235 Z" fill="url(#cartilageGrad)" filter="url(#cartGlow)"/>
  <path d="M 328 235 C 330 258 302 268 272 258 C 290 250 315 245 328 235 Z" fill="url(#cartilageGrad)" filter="url(#cartGlow)"/>

  <!-- Meniscus (Medial & Lateral Cartilage Cushions) -->
  <ellipse cx="205" cy="285" rx="35" ry="10" fill="url(#cartilageGrad)"/>
  <ellipse cx="295" cy="285" rx="35" ry="10" fill="url(#cartilageGrad)"/>

  <!-- Cruciate Ligaments (ACL & PCL - الرباط الصليبي) -->
  <!-- PCL -->
  <path d="M 235 245 L 275 305" stroke="url(#ligamentGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- ACL (Anterior Cruciate Ligament) Crossing -->
  <path d="M 265 245 L 225 305" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
  <path d="M 265 245 L 225 305" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Tibia (Shin bone) -->
  <path d="M 180 295 C 180 285 220 280 250 280 C 280 280 320 285 320 295 C 320 320 280 340 280 430 L 220 430 C 220 340 180 320 180 295 Z" 
        fill="#e2e8f0" stroke="#0284c7" stroke-width="3"/>

  <!-- Fibula (Side bone) -->
  <path d="M 335 320 C 350 325 355 340 350 360 L 335 430 L 315 430 L 325 350 Z" 
        fill="#cbd5e1" stroke="#0284c7" stroke-width="2"/>

  <!-- Collateral Ligaments (LCL & MCL) -->
  <path d="M 168 210 Q 155 270 175 320" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 332 210 Q 345 270 330 320" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Arthroscopic Optical Beam / Laser Visual Indicator -->
  <g transform="translate(100, 200)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" opacity="0.4"/>
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
    <line x1="0" y1="0" x2="135" y2="75" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-20" fill="#38bdf8" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold">منظار المفاصل</text>
  </g>

  <!-- Badge Label -->
  <g transform="translate(25, 30)">
    <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="90" y="22" fill="#38bdf8" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">مناظير وإصلاح الأربطة</text>
  </g>
</svg>
