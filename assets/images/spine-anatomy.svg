<!-- Spine Anatomy Clinical Medical Vector -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091426"/>
      <stop offset="100%" stop-color="#0f2942"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="nerveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="spineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="16" fill="url(#spineBg)"/>

  <!-- Subtle Medical Waves / Resonance Grid -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.3" fill="none">
    <circle cx="250" cy="250" r="100"/>
    <circle cx="250" cy="250" r="160"/>
    <circle cx="250" cy="250" r="220"/>
    <line x1="250" y1="0" x2="250" y2="500" stroke-dasharray="4 4"/>
  </g>

  <!-- Nerve Roots (Lateral Branches) -->
  <g stroke="url(#nerveGrad)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 230 110 Q 180 115 150 140"/>
    <path d="M 270 110 Q 320 115 350 140"/>
    <path d="M 230 170 Q 170 175 140 205"/>
    <path d="M 270 170 Q 330 175 360 205"/>
    <path d="M 230 230 Q 165 240 135 270"/>
    <path d="M 270 230 Q 335 240 365 270"/>
    <path d="M 230 290 Q 170 300 140 335"/>
    <path d="M 270 290 Q 330 300 360 335"/>
    <path d="M 230 350 Q 180 360 150 395"/>
    <path d="M 270 350 Q 320 360 350 395"/>
  </g>

  <!-- Vertebrae Sequence -->
  <!-- Vertebra 1 (Cervical / Thoracic transition) -->
  <g transform="translate(0, 70)">
    <rect x="220" y="0" width="60" height="34" rx="8" fill="#e2e8f0" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="250" cy="38" rx="26" ry="6" fill="url(#discGrad)"/>
    <path d="M 230 8 L 270 8" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Vertebra 2 -->
  <g transform="translate(0, 130)">
    <rect x="215" y="0" width="70" height="38" rx="8" fill="#e2e8f0" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="250" cy="42" rx="30" ry="7" fill="url(#discGrad)"/>
    <path d="M 228 9 L 272 9" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Vertebra 3 (Lumbar L3) -->
  <g transform="translate(0, 195)">
    <rect x="210" y="0" width="80" height="42" rx="9" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Intervertebral Disc with Disc Cushion Highlight -->
    <ellipse cx="250" cy="46" rx="34" ry="8" fill="url(#discGrad)" filter="url(#spineGlow)"/>
    <!-- Spinous process detail -->
    <path d="M 250 -4 L 250 8" stroke="#0284c7" stroke-width="3"/>
    <circle cx="225" cy="20" r="3" fill="#0284c7"/>
    <circle cx="275" cy="20" r="3" fill="#0284c7"/>
  </g>

  <!-- Vertebra 4 (Lumbar L4) -->
  <g transform="translate(0, 265)">
    <rect x="205" y="0" width="90" height="44" rx="9" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5"/>
    <ellipse cx="250" cy="48" rx="38" ry="9" fill="url(#discGrad)"/>
    <path d="M 250 -4 L 250 8" stroke="#0284c7" stroke-width="3"/>
    <circle cx="222" cy="22" r="3" fill="#0284c7"/>
    <circle cx="278" cy="22" r="3" fill="#0284c7"/>
  </g>

  <!-- Vertebra 5 (Lumbar L5) -->
  <g transform="translate(0, 335)">
    <rect x="200" y="0" width="100" height="46" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5"/>
    <ellipse cx="250" cy="50" rx="42" ry="10" fill="url(#discGrad)"/>
  </g>

  <!-- Sacrum Base -->
  <g transform="translate(0, 400)">
    <path d="M 195 0 C 220 5 280 5 305 0 L 290 60 C 275 80 225 80 210 60 Z" fill="#cbd5e1" stroke="#0284c7" stroke-width="2"/>
    <circle cx="230" cy="25" r="4" fill="#0f172a"/>
    <circle cx="270" cy="25" r="4" fill="#0f172a"/>
    <circle cx="235" cy="45" r="3" fill="#0f172a"/>
    <circle cx="265" cy="45" r="3" fill="#0f172a"/>
  </g>

  <!-- Callout Label -->
  <g transform="translate(25, 30)">
    <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="90" y="22" fill="#38bdf8" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">جراحة العمود الفقري الدقيقة</text>
  </g>
</svg>
