<!-- Ilizarov External Fixator Medical Diagram -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Clinical Tech Background -->
  <rect width="600" height="450" rx="16" fill="#0b1727"/>
  <circle cx="300" cy="225" r="180" fill="#0284c7" opacity="0.08" filter="url(#glow)"/>

  <!-- Medical Grid Overlay -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="0" y1="75" x2="600" y2="75"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
  </g>

  <!-- Tibia / Long Bone Representation -->
  <g opacity="0.95">
    <!-- Upper bone segment -->
    <path d="M 285 40 C 270 40 260 60 265 90 L 275 180 C 275 190 285 195 295 195 L 305 195 C 315 195 325 190 325 180 L 335 90 C 340 60 330 40 315 40 Z" fill="url(#boneGrad)"/>
    <!-- Osteotomy / Regeneration Gap (Corticotomy) -->
    <rect x="275" y="195" width="50" height="40" fill="#0284c7" opacity="0.3" rx="4"/>
    <path d="M 280 215 L 320 215" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Lower bone segment -->
    <path d="M 275 235 C 275 225 285 220 295 220 L 305 220 C 315 220 325 225 325 235 L 335 340 C 340 375 350 400 325 410 C 300 420 295 400 290 400 C 285 400 275 420 260 405 C 250 395 260 365 265 340 Z" fill="url(#boneGrad)"/>
  </g>

  <!-- Ilizarov Ring 1 (Top) -->
  <ellipse cx="300" cy="110" rx="140" ry="32" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.95"/>
  <ellipse cx="300" cy="110" rx="134" ry="26" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.8"/>

  <!-- Ilizarov Ring 2 (Middle Upper) -->
  <ellipse cx="300" cy="175" rx="140" ry="32" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.95"/>
  <ellipse cx="300" cy="175" rx="134" ry="26" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.8"/>

  <!-- Ilizarov Ring 3 (Middle Lower) -->
  <ellipse cx="300" cy="265" rx="140" ry="32" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.95"/>
  <ellipse cx="300" cy="265" rx="134" ry="26" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.8"/>

  <!-- Ilizarov Ring 4 (Bottom) -->
  <ellipse cx="300" cy="335" rx="140" ry="32" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.95"/>
  <ellipse cx="300" cy="335" rx="134" ry="26" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.8"/>

  <!-- Connecting Threaded Rods -->
  <rect x="175" y="80" width="10" height="280" rx="5" fill="url(#rodGrad)"/>
  <rect x="415" y="80" width="10" height="280" rx="5" fill="url(#rodGrad)"/>
  <rect x="235" y="105" width="8" height="235" rx="4" fill="url(#rodGrad)" opacity="0.8"/>
  <rect x="355" y="105" width="8" height="235" rx="4" fill="url(#rodGrad)" opacity="0.8"/>

  <!-- Transfixing Kirschner Wires & Fixation Bolts -->
  <line x1="165" y1="110" x2="435" y2="110" stroke="#f8fafc" stroke-width="2.5" opacity="0.9"/>
  <line x1="200" y1="125" x2="400" y2="95" stroke="#f8fafc" stroke-width="2.5" opacity="0.9"/>
  <line x1="165" y1="175" x2="435" y2="175" stroke="#f8fafc" stroke-width="2.5" opacity="0.9"/>
  <line x1="165" y1="265" x2="435" y2="265" stroke="#f8fafc" stroke-width="2.5" opacity="0.9"/>
  <line x1="165" y1="335" x2="435" y2="335" stroke="#f8fafc" stroke-width="2.5" opacity="0.9"/>
  <line x1="200" y1="320" x2="400" y2="350" stroke="#f8fafc" stroke-width="2.5" opacity="0.9"/>

  <!-- Fixation Nuts/Bolts on Rings -->
  <circle cx="180" cy="110" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <circle cx="420" cy="110" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <circle cx="180" cy="175" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <circle cx="420" cy="175" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <circle cx="180" cy="265" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <circle cx="420" cy="265" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <circle cx="180" cy="335" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <circle cx="420" cy="335" r="7" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>

  <!-- Clinical Precision Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="6" fill="#38bdf8"/>
    <text x="35" y="22" fill="#e2e8f0" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold">Ilizarov Method</text>
  </g>
  <g transform="translate(380, 385)">
    <rect width="190" height="34" rx="17" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="25" y="22" fill="#38bdf8" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold">بناء وتطويل العظام</text>
  </g>
</svg>
